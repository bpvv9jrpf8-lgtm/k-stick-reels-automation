name: Kids Vehicle Animation Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-test.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-test.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout kids vehicle branch
        uses: actions/checkout@v4
        with:
          ref: kids-vehicles-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r vehicles/requirements.txt

      - name: Build reusable kids SFX and music
        run: |
          mkdir -p vehicles/sfx
          ffmpeg -y -f lavfi -i "sine=frequency=150:duration=1.4" -af "tremolo=f=12:d=0.45,volume=0.28,afade=t=out:st=1.0:d=0.35" vehicles/sfx/engine.wav
          ffmpeg -y -f lavfi -i "anoisesrc=color=brown:duration=0.65" -af "lowpass=f=1200,volume=0.30,afade=t=out:st=0.30:d=0.30" vehicles/sfx/splash.wav
          ffmpeg -y -f lavfi -i "sine=frequency=230:duration=0.8" -af "tremolo=f=18:d=0.8,volume=0.30" vehicles/sfx/spin.wav
          ffmpeg -y -f lavfi -i "sine=frequency=520:duration=0.35" -af "volume=0.30,afade=t=out:st=0.18:d=0.15" vehicles/sfx/horn.wav
          ffmpeg -y -f lavfi -i "sine=frequency=1100:duration=0.12" -af "volume=0.28" vehicles/sfx/click.wav
          ffmpeg -y -f lavfi -i "sine=frequency=180:duration=0.38" -af "asetrate=44100*0.7,aresample=44100,volume=0.35" vehicles/sfx/mudpop.wav
          ffmpeg -y -f lavfi -i "sine=frequency=780:duration=0.55" -af "tremolo=f=7:d=0.65,volume=0.20" vehicles/sfx/cheer.wav
          ffmpeg -y -f lavfi -i "sine=frequency=650:duration=0.38" -af "asetrate=44100*0.55,aresample=44100,volume=0.30" vehicles/sfx/boing.wav
          ffmpeg -y -f lavfi -i "sine=frequency=460:duration=0.7" -af "tremolo=f=8:d=0.8,volume=0.18" vehicles/sfx/laugh.wav
          ffmpeg -y -f lavfi -i "sine=frequency=262:duration=34" -af "tremolo=f=2:d=0.25,volume=0.10" vehicles/sfx/music.wav

      - name: Render first cartoon vehicle short
        run: python vehicles/render.py

      - name: Mix SFX and music
        run: python vehicles/mix_audio.py

      - name: Verify output
        run: |
          test -s vehicles/out/kids-vehicle-short.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 vehicles/out/kids-vehicle-short.mp4

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: kids-vehicle-animation-sample
          path: vehicles/out/kids-vehicle-short.mp4
          retention-days: 7
