name: K-Stick Prop Pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prop-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate apple
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py apple

      - name: Generate phone
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py phone

      - name: Generate laptop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py laptop

      - name: Generate chair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py chair

      - name: Generate pillow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py pillow

      - name: Generate alarm clock
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py alarm_clock

      - name: Generate shopping bag
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py shopping_bag

      - name: Generate burger
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py burger

      - name: Generate book
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py book

      - name: Generate stool
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py stool

      - name: Generate scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py scanner

      - name: Generate kiosk
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_prop.py kiosk

      - name: Remove prop backgrounds
        run: python make_props_transparent.py

      - name: Generate new story
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Build smart scene plan
        run: python plan_scenes.py

      - name: Generate AI voiceover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_voice.py

      - name: Build reel with props
        run: python build_reel.py

      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: k-stick-prop-test
          path: output/k_stick_reel_final.mp4
          retention-days: 7

      - name: Save prop library and story
        run: |
          git config user.name "k-stick-bot"
          git config user.email "k-stick-bot@users.noreply.github.com"

          git add assets/props_raw/ \
            assets/props/ \
            used_topics.json \
            latest_story.json \
            scene_plan.json

          if git diff --cached --quiet; then
            echo "No new files to save."
          else
            git commit -m "Create reusable K-Stick prop library"
            git push
          fi
