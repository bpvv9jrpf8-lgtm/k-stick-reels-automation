name: K-Stick Final Polish Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate fresh K-Stick story
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Build smart scene plan
        run: python plan_scenes.py

      - name: Generate narrator and K-Stick voices
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_voice.py

      - name: Build polished reel
        run: python build_reel.py

      - name: Upload polished reel
        uses: actions/upload-artifact@v4
        with:
          name: k-stick-final-polish
          path: output/k_stick_reel_polished.mp4
          retention-days: 7

      - name: Save successful story history
        run: |
          git config user.name "k-stick-bot"
          git config user.email "k-stick-bot@users.noreply.github.com"

          git add used_topics.json \
            latest_story.json \
            scene_plan.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Save K-Stick polished reel story"
            git push
          fi
