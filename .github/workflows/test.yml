name: K-Stick Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate K-Stick base character
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_character.py

      - name: Generate K-Stick happy expression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_expression.py happy

      - name: Generate K-Stick sad expression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_expression.py sad

      - name: Generate K-Stick angry expression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_expression.py angry

      - name: Generate K-Stick shocked expression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_expression.py shocked

      - name: Generate K-Stick sleepy expression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_expression.py sleepy

      - name: Generate bedroom background
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_background.py bedroom

      - name: Generate office background
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_background.py office

      - name: Generate classroom background
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_background.py classroom

      - name: Generate kitchen background
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_background.py kitchen

      - name: Generate street background
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_background.py street

      - name: Generate new K-Stick story
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Build scene plan
        run: python plan_scenes.py

      - name: Save generated files
        run: |
          git config user.name "k-stick-bot"
          git config user.email "k-stick-bot@users.noreply.github.com"

          git add used_topics.json \
            latest_story.json \
            scene_plan.json \
            assets/character/k_stick_base.png \
            assets/expressions/k_stick_happy.png \
            assets/expressions/k_stick_sad.png \
            assets/expressions/k_stick_angry.png \
            assets/expressions/k_stick_shocked.png \
            assets/expressions/k_stick_sleepy.png \
            assets/backgrounds/bedroom.png \
            assets/backgrounds/office.png \
            assets/backgrounds/classroom.png \
            assets/backgrounds/kitchen.png \
            assets/backgrounds/street.png

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update K-Stick story and reusable assets"
            git push
          fi
