import json
import os

STORY_FILE = "latest_story.json"
OUTPUT_FILE = "scene_plan.json"

EXPRESSION_FILES = {
    "happy": "assets/expressions/k_stick_happy.png",
    "sad": "assets/expressions/k_stick_sad.png",
    "angry": "assets/expressions/k_stick_angry.png",
    "shocked": "assets/expressions/k_stick_shocked.png",
    "sleepy": "assets/expressions/k_stick_sleepy.png",
}

BACKGROUND_FILES = {
    "bedroom": "assets/backgrounds/bedroom.png",
    "office": "assets/backgrounds/office.png",
    "classroom": "assets/backgrounds/classroom.png",
    "kitchen": "assets/backgrounds/kitchen.png",
    "street": "assets/backgrounds/street.png",
}


def choose_expression(text):
    text = text.lower()

    if any(word in text for word in [
        "shock", "surprise", "scared", "wide eyes", "suddenly", "panic"
    ]):
        return "shocked"

    if any(word in text for word in [
        "angry", "mad", "frustrated", "annoyed", "furious"
    ]):
        return "angry"

    if any(word in text for word in [
        "sad", "cry", "upset", "disappointed", "tears"
    ]):
        return "sad"

    if any(word in text for word in [
        "sleep", "tired", "bed", "yawn", "sleepy"
    ]):
        return "sleepy"

    return "happy"


def choose_background(story):
    requested_bg = story.get("background", "").lower()

    for key in BACKGROUND_FILES:
        if key in requested_bg:
            return key

    combined = " ".join([
        story.get("scene_1", ""),
        story.get("scene_2", ""),
        story.get("scene_3", ""),
        story.get("twist_ending", "")
    ]).lower()

    if any(word in combined for word in [
        "bed", "sleep", "alarm", "pillow", "bedroom"
    ]):
        return "bedroom"

    if any(word in combined for word in [
        "office", "desk", "work", "laptop", "computer"
    ]):
        return "office"

    if any(word in combined for word in [
        "school", "exam", "teacher", "class", "classroom"
    ]):
        return "classroom"

    if any(word in combined for word in [
        "food", "fridge", "burger", "kitchen", "snack"
    ]):
        return "kitchen"

    return "street"


def main():
    if not os.path.exists(STORY_FILE):
        raise FileNotFoundError(
            "latest_story.json not found. Run main.py first."
        )

    with open(STORY_FILE, "r", encoding="utf-8") as f:
        story = json.load(f)

    background_key = choose_background(story)
    background_asset = BACKGROUND_FILES[background_key]

    scene_texts = [
        story.get("scene_1", ""),
        story.get("scene_2", ""),
        story.get("scene_3", ""),
        story.get("twist_ending", "")
    ]

    durations = [3, 3, 3, 4]

    scene_plan = {
        "topic": story.get("topic", ""),
        "hook_text": story.get("hook_text", ""),
        "selected_background": background_key,
        "background_asset": background_asset,
        "prop": story.get("prop", ""),
        "video_title": story.get("video_title", ""),
        "facebook_caption": story.get("facebook_caption", ""),
        "youtube_description": story.get("youtube_description", ""),
        "hashtags": story.get("hashtags", []),
        "motion_prompt": story.get("motion_prompt", ""),
        "scenes": []
    }

    for index, text in enumerate(scene_texts):
        expression = choose_expression(text)

        scene_plan["scenes"].append({
            "scene_number": index + 1,
            "duration_seconds": durations[index],
            "story_text": text,
            "character_asset": EXPRESSION_FILES[expression],
            "background_asset": background_asset,
            "expression": expression,
            "prop": story.get("prop", "")
        })

    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
        json.dump(
            scene_plan,
            f,
            indent=2,
            ensure_ascii=False
        )

    print("\n=== K-STICK SCENE PLAN ===")
    print(
        json.dumps(
            scene_plan,
            indent=2,
            ensure_ascii=False
        )
    )

    print("\nSaved as scene_plan.json")


if __name__ == "__main__":
    main()
