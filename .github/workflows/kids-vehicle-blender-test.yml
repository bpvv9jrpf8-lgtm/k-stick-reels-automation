name: Kids Vehicle Modeled Asset Motion Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-blender-test.yml'

jobs:
  render-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout modeled vehicle branch
        uses: actions/checkout@v4
        with:
          ref: kids-vehicle-assets-v1

      - name: Download official Kenney Car Kit CC0
        run: |
          curl -L --fail --retry 2 --connect-timeout 15 \
            'https://www.kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip' \
            -o car-kit.zip
          unzip -q car-kit.zip -d car-kit
          test -s 'car-kit/Models/GLB format/sedan.glb'
          test -s 'car-kit/Models/GLB format/firetruck.glb'

      - name: Install portable Blender and minimal EGL runtime
        run: |
          curl -L --fail --retry 3 --connect-timeout 20 \
            'https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz' \
            -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1
          echo '/tmp/blender' >> "$GITHUB_PATH"
          /tmp/blender/blender --version | head -n 2
          ldconfig -p | grep -F 'libEGL.so.1'

      - name: Prepare fast 3-second preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('blender3d/kenney_asset_motion_test.py')
          s=p.read_text()
          s=s.replace('scene.render.resolution_x=540','scene.render.resolution_x=360')
          s=s.replace('scene.render.resolution_y=960','scene.render.resolution_y=640')
          s=s.replace('scene.frame_start=1; scene.frame_end=72; scene.render.fps=24',
                      'scene.frame_start=1; scene.frame_end=72; scene.frame_step=2; scene.render.fps=12')
          p.write_text(s)
          PY

      - name: Render modeled asset sample
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          blender -b --python blender3d/kenney_asset_motion_test.py
          test -s /tmp/kids-vehicle-kenney-motion.mp4
          cp /tmp/kids-vehicle-kenney-motion.mp4 kids-vehicle-modeled-motion.mp4
          ls -lh kids-vehicle-modeled-motion.mp4

      - name: Upload modeled motion sample
        uses: actions/upload-artifact@v4
        with:
          name: kids-vehicle-modeled-motion-sample
          path: kids-vehicle-modeled-motion.mp4
          retention-days: 3
