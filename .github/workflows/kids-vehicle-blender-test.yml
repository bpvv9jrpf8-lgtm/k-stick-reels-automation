name: Kids Vehicle Premium 3D Motion Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-blender-test.yml'

jobs:
  render-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout premium vehicle asset branch
        uses: actions/checkout@v4
        with:
          ref: kids-vehicle-assets-v1

      - name: Install Blender headless graphics libs
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends blender libegl1 libgl1 libglx-mesa0 libopengl0 ffmpeg

      - name: Prepare fast 3-second preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('blender3d/asset_motion_test.py')
          s=p.read_text()
          s=s.replace('scene.render.resolution_x=540','scene.render.resolution_x=360')
          s=s.replace('scene.render.resolution_y=960','scene.render.resolution_y=640')
          s=s.replace('scene.frame_start=1; scene.frame_end=72; scene.render.fps=24',
                      'scene.frame_start=1; scene.frame_end=72; scene.frame_step=2; scene.render.fps=12')
          p.write_text(s)
          PY

      - name: Render premium motion sample
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          blender -b --python blender3d/asset_motion_test.py
          test -s /tmp/kids-vehicle-premium-motion.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 /tmp/kids-vehicle-premium-motion.mp4
          cp /tmp/kids-vehicle-premium-motion.mp4 kids-vehicle-premium-motion.mp4

      - name: Upload premium motion sample
        uses: actions/upload-artifact@v4
        with:
          name: kids-vehicle-premium-motion-sample
          path: kids-vehicle-premium-motion.mp4
          retention-days: 3
