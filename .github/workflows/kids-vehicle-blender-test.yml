name: Kids Vehicle Blender 3D Keyframe Test

# Fast visual QA: render only four still frames before spending minutes on full video.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-blender-test.yml'

jobs:
  render-keyframes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Blender vehicle branch
        uses: actions/checkout@v4
        with:
          ref: kids-vehicles-blender-v1

      - name: Install Blender headless graphics libs
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils

      - name: Prepare fast keyframe preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('blender3d/scene_v4.py')
          s = p.read_text()
          s = s.replace('scene.render.resolution_x=720', 'scene.render.resolution_x=360')
          s = s.replace('scene.render.resolution_y=1280', 'scene.render.resolution_y=640')
          old = "bpy.ops.render.render(animation=True)\nprint(scene.render.filepath)"
          new = """scene.render.image_settings.file_format='PNG'\nimport os\nos.makedirs('blender3d/out/keyframes', exist_ok=True)\nfor f in (1, 88, 188, 260):\n    scene.frame_set(f)\n    scene.render.filepath=f'blender3d/out/keyframes/frame-{f:03d}.png'\n    bpy.ops.render.render(write_still=True)\n    print(scene.render.filepath)"""
          if old not in s:
              raise SystemExit('Expected render block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Render four keyframes only
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p blender3d/out/keyframes
          blender -b --python blender3d/scene_v4.py
          test -s blender3d/out/keyframes/frame-001.png
          test -s blender3d/out/keyframes/frame-088.png
          test -s blender3d/out/keyframes/frame-188.png
          test -s blender3d/out/keyframes/frame-260.png

      - name: Upload keyframe preview
        uses: actions/upload-artifact@v4
        with:
          name: kids-vehicle-v4-keyframes
          path: blender3d/out/keyframes/*.png
          retention-days: 3
