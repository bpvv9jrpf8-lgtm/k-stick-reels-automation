name: Kids Vehicle Modeled Asset Motion Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-blender-test.yml'

jobs:
  render-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout modeled vehicle branch
        uses: actions/checkout@v4
        with:
          ref: kids-vehicle-assets-v1

      - name: Download official Kenney Car Kit CC0
        run: |
          curl -L --fail --retry 2 --connect-timeout 15 \
            'https://www.kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip' \
            -o car-kit.zip
          unzip -q car-kit.zip -d car-kit
          test -s 'car-kit/Models/GLB format/sedan.glb'
          test -s 'car-kit/Models/GLB format/firetruck.glb'

      - name: Prepare ultra-fast preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('blender3d/kenney_asset_motion_test.py')
          s=p.read_text()
          s=s.replace('scene.render.resolution_x=540','scene.render.resolution_x=270')
          s=s.replace('scene.render.resolution_y=960','scene.render.resolution_y=480')
          s=s.replace('scene.frame_start=1; scene.frame_end=72; scene.render.fps=24',
                      'scene.frame_start=1; scene.frame_end=48; scene.frame_step=3; scene.render.fps=8')
          s=s.replace("'/tmp/kids-vehicle-kenney-motion.mp4'", "'/work/kids-vehicle-modeled-motion.mp4'")
          s=s.replace("'/tmp/kids_vehicle_kenney_asset_test.blend'", "'/work/kids_vehicle_kenney_asset_test.blend'")
          p.write_text(s)
          PY

      - name: Render with prebuilt headless Blender container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            blenderkit/headless-blender:multi-version \
            /home/headless/blenders/4.3/blender -b --python blender3d/kenney_asset_motion_test.py
          test -s kids-vehicle-modeled-motion.mp4
          ls -lh kids-vehicle-modeled-motion.mp4

      - name: Upload modeled motion sample
        uses: actions/upload-artifact@v4
        with:
          name: kids-vehicle-modeled-motion-sample
          path: kids-vehicle-modeled-motion.mp4
          retention-days: 3
