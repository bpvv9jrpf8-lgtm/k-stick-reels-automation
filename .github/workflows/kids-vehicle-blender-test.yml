name: Kids Vehicle CC0 Asset Inventory

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-vehicle-blender-test.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official Kenney Car Kit
        run: |
          curl -L --fail --retry 2 --connect-timeout 15 \
            'https://www.kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip' \
            -o car-kit.zip
          unzip -q car-kit.zip -d car-kit
      - name: List useful vehicle models
        run: |
          echo '--- VEHICLE MODEL FILES ---'
          find car-kit -type f | grep -Ei '\.(gltf|glb|fbx|obj)$' | sort | grep -Ei 'fire|tractor|sedan|truck|ambulance|police|suv|delivery|hatch' || true
          echo '--- TOP LEVEL ---'
          find car-kit -maxdepth 3 -type f | sort | head -160
